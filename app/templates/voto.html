{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voto_pag</title>
    <link rel="stylesheet" href="{% static 'voto.css' %}">
</head>
<body>
    <div class="container">
        <div class="uslogado">Bem vindo <label class="usname">{{uslogado}}</label></div>
        {% if messages %}
            {% for message in messages %}
                <div class="message" >{{message}}</div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'votar' %}" method="POST">
            {% csrf_token %}

            <fieldset>
                <legend>Chefe</legend>
                <!-- Adicione os campos do formulário de voto aqui -->
                <label><input type="radio" name="pr" value="1">Cristencio</label>
                <label><input type="radio" name="pr" value="2">Credson</label>
                <label><input type="radio" name="pr" value="3">Benilva</label>
                <label><input type="radio" name="pr" value="4">Ginalda</label>
                <label><input type="radio" name="pr" value="5">Bambo</label>
                <label><input type="radio" name="pr" value="6">Eduardo</label>
                <label><input type="radio" name="pr" value="7">Lucas</label>
            </fieldset>
            <button type="submit">Votar</button>
        </form>
        <div class="logout">
            <a href="{% url 'logout' %}">Sair</a>
        </div>
    </div>
</body>
</html>
