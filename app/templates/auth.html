{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentição</title>
    <link rel="stylesheet" href="{% static 'auth.css' %}">
</head>
<body>
    <div class="container" id="lg">
        <h2>Login</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{message}}</div>
            {% endfor %}
        {% endif %}
        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <div class="grid">
                <label>Nome do usuário:</label>
                <input type="text" name="usname" required>
            </div>

            <div class="grid">
                <label>Senha:</label>
                <input type="password" name="senha" required>
            </div>

            <input type="submit" value="Logar" class="btn">
        </form>
        <div class="div-link">Não tem conta? <button onclick="mudar('rg')" class="btn-link">Registe-se</button></div>
    </div>

    <div class="container ativo" id="rg">
        <h2>Registrar</h2>
        <form action="{% url 'registrar' %}" method="POST">
            {% csrf_token %}

            <div class="grid">
                <label>Nome do usuário:</label>
                <input type="text" name="usname" required>
            </div>

            <div class="grid">
                <label>Email:</label>
                <input type="email" name="email" required>
            </div>

            <div class="grid">
                <label>Senha:</label>
                <input type="password" name="senha" required>
            </div>

            <input type="submit" value="Registrar" class="btn">
        </form>
        <div class="div-link">Tem conta? <button onclick="mudar('lg')" class="btn-link">Faça login</button></div>
    </div>
</body>
<script src="{% static 'auth.js' %}"></script>
</html>
